<!doctype html>
<meta charset="utf-8">
<title>chibi render</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three'
import { loadAvatarModel } from '/src/engine/objects/avatarModel.ts'
const W = 576, H = 892
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0)
renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c4d0, 1.5))
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1.5, 2.5, 3); scene.add(key)
const fill = new THREE.DirectionalLight(0xdfeaff, .7); fill.position.set(2, .5, 1.5); scene.add(fill)
const model = await loadAvatarModel({ yaw: -0.28 })
if (!model) throw new Error('GLB introuvable')
scene.add(model)
const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
const camera = new THREE.PerspectiveCamera(22, W / H, .1, 50)
const dist = (size.y * .56) / Math.tan(THREE.MathUtils.degToRad(11))
camera.position.set(c.x, c.y + size.y * .02, c.z + dist); camera.lookAt(c.x, c.y, c.z)
renderer.render(scene, camera)
window.__done = true
</script>
